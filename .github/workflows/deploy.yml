# Build the site from main and publish it on GitHub Pages. Start it by hand from
# the Actions tab ("Run workflow") to publish code changes; the Puzzles workflow
# also calls it after committing new data. It never runs on push or pull request.
name: Deploy site

on:
  workflow_dispatch:
  workflow_call:

# One deploy at a time; a newer one waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Always the latest main, including a data commit pushed moments ago.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
