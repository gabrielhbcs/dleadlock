# Twice a week: build the next days of puzzles from the Deadlock API and commit
# them to main in a single commit, then publish the site (deploy.yml) so the new
# puzzles go live. It never runs on push or pull request; it can also be started
# by hand from the Actions tab ("Run workflow").
#
# After a balance patch, run it by hand with the patch day: future puzzles are
# rebuilt with matches from after the patch only (needs 2 complete days after
# it, so run it 3+ days after the patch). Today's puzzle is never touched.
name: Puzzles

on:
  schedule:
    # Mondays and Thursdays at 03:00 UTC (00:00 in Brasília). Each run builds up
    # to 7 days ahead, so a failed run still leaves three spare days to run it
    # by hand.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
    inputs:
      patch_date:
        description: 'Balance patch day (UTC, YYYY-MM-DD). Leave empty for a normal run.'
        required: false
        default: ''

# Never two runs at the same time (they would race on the data commit).
concurrency:
  group: puzzles
  cancel-in-progress: false

jobs:
  puzzles:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the generated data
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Raw API answers per UTC day, so days shared with the previous run are not
      # queried again (the SQL API allows ~2 queries/min).
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Build puzzles
        working-directory: pipeline
        env:
          PATCH_DATE: ${{ inputs.patch_date }}
        run: |
          # Editable install: the pipeline finds web/public/data relative to the repo.
          pip install -e .
          python -m dleadlock_pipeline all ${PATCH_DATE:+--patch-date "$PATCH_DATE"}

      - name: Commit new data
        env:
          PATCH_DATE: ${{ inputs.patch_date }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data
          if git diff --cached --quiet; then
            echo 'No new data.'
          else
            last=$(ls web/public/data/*/*/????-??-??.json | xargs -n1 basename | sort | tail -1)
            git commit -m "data: puzzles up to ${last%.json}${PATCH_DATE:+ (rebuilt after the $PATCH_DATE patch)}"
            # Someone may have pushed to main while the pipeline was running.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # Publish the site with the new data. A push made by this workflow does not
  # start other workflows, so the deploy is called from here.
  deploy:
    needs: puzzles
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
