[project]
name = "dleadlock-pipeline"
version = "0.1.0"
description = "Data pipeline that builds the daily dleadlock puzzles from the public Deadlock API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
dleadlock-pipeline = "dleadlock_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dleadlock_pipeline*"]

[tool.setuptools.package-data]
dleadlock_pipeline = ["queries/*.sql"]
